name: ${HARBOR_COMPOSE_PROJECT:-harbor}

services:
  log:
    image: goharbor/harbor-log:v2.15.2
    container_name: ${HARBOR_LOG_CONTAINER:-harbor-log}
    restart: always
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
    volumes:
      - ${HARBOR_DATA_DIR:-../work/data}/log:/var/log/docker/:z
      - ${HARBOR_CONFIG_DIR:-../work/common/config}/log/rsyslog.conf:/etc/rsyslog.conf:ro
      - ${HARBOR_CONFIG_DIR:-../work/common/config}/log/rsyslog_docker.conf:/etc/rsyslog.d/rsyslog_docker.conf:ro
    ports:
      - 127.0.0.1:${HARBOR_LOG_PORT:-1514}:10514
    networks: [harbor]

  registry:
    image: goharbor/registry-photon:v2.15.2
    container_name: ${HARBOR_REGISTRY_CONTAINER:-registry}
    restart: always
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    volumes:
      - ${HARBOR_DATA_DIR:-../work/data}/registry:/storage:z
      - ${HARBOR_CONFIG_DIR:-../work/common/config}/registry:/etc/registry:ro
      - ${HARBOR_DATA_DIR:-../work/data}/secret/registry/root.crt:/etc/registry/root.crt:ro
      - ${HARBOR_CONFIG_DIR:-../work/common/config}/shared/trust-certificates:/harbor_cust_cert:ro
    depends_on: [log]
    networks: [harbor]

  registryctl:
    image: goharbor/harbor-registryctl:v2.15.2
    container_name: ${HARBOR_REGISTRYCTL_CONTAINER:-registryctl}
    restart: always
    env_file: [${HARBOR_CONFIG_DIR:-../work/common/config}/registryctl/env]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    volumes:
      - ${HARBOR_DATA_DIR:-../work/data}/registry:/storage:z
      - ${HARBOR_CONFIG_DIR:-../work/common/config}/registry:/etc/registry:ro
      - ${HARBOR_CONFIG_DIR:-../work/common/config}/registryctl/config.yml:/etc/registryctl/config.yml:ro
      - ${HARBOR_CONFIG_DIR:-../work/common/config}/shared/trust-certificates:/harbor_cust_cert:ro
    depends_on: [log]
    networks: [harbor]

  postgresql:
    image: goharbor/harbor-db:v2.15.2
    container_name: ${HARBOR_DB_CONTAINER:-harbor-db}
    restart: always
    env_file: [${HARBOR_CONFIG_DIR:-../work/common/config}/db/env]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
    shm_size: 1gb
    volumes:
      - ${HARBOR_DATA_DIR:-../work/data}/database:/var/lib/postgresql/data:z
    depends_on: [log]
    networks: [harbor]

  core:
    image: goharbor/harbor-core:v2.15.2
    container_name: ${HARBOR_CORE_CONTAINER:-harbor-core}
    restart: always
    env_file: [${HARBOR_CONFIG_DIR:-../work/common/config}/core/env]
    cap_drop: [ALL]
    cap_add: [SETGID, SETUID]
    volumes:
      - ${HARBOR_DATA_DIR:-../work/data}:/data:z
      - ${HARBOR_CONFIG_DIR:-../work/common/config}/core:/etc/core:ro
      - ${HARBOR_CONFIG_DIR:-../work/common/config}/shared/trust-certificates:/harbor_cust_cert:ro
      - ${HARBOR_DATA_DIR:-../work/data}/secret/core/private_key.pem:/etc/core/private_key.pem:ro
      - ${HARBOR_DATA_DIR:-../work/data}/secret/keys/secretkey:/etc/core/key:ro
    depends_on: [log, registry, registryctl, postgresql, redis]
    networks: [harbor]

  portal:
    image: goharbor/harbor-portal:v2.15.2
    container_name: ${HARBOR_PORTAL_CONTAINER:-harbor-portal}
    restart: always
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    volumes:
      - ${HARBOR_CONFIG_DIR:-../work/common/config}/portal/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [log]
    networks: [harbor]

  jobservice:
    image: goharbor/harbor-jobservice:v2.15.2
    container_name: ${HARBOR_JOBSERVICE_CONTAINER:-harbor-jobservice}
    restart: always
    env_file: [${HARBOR_CONFIG_DIR:-../work/common/config}/jobservice/env]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    volumes:
      - ${HARBOR_DATA_DIR:-../work/data}/job_logs:/var/log/jobs:z
      - ${HARBOR_CONFIG_DIR:-../work/common/config}/jobservice:/etc/jobservice:ro
      - ${HARBOR_CONFIG_DIR:-../work/common/config}/shared/trust-certificates:/harbor_cust_cert:ro
    depends_on: [core]
    networks: [harbor]

  redis:
    image: goharbor/valkey-photon:v2.15.2
    container_name: ${HARBOR_REDIS_CONTAINER:-redis}
    restart: always
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    volumes:
      - ${HARBOR_DATA_DIR:-../work/data}/redis:/var/lib/redis
    depends_on: [log]
    networks: [harbor]

  trivy-adapter:
    image: goharbor/trivy-adapter-photon:v2.15.2
    container_name: ${HARBOR_TRIVY_CONTAINER:-trivy-adapter}
    restart: always
    env_file: [${HARBOR_CONFIG_DIR:-../work/common/config}/trivy-adapter/env]
    cap_drop: [ALL]
    volumes:
      - ${HARBOR_DATA_DIR:-../work/data}/trivy-adapter:/home/scanner/.cache
      - ${HARBOR_CONFIG_DIR:-../work/common/config}/shared/trust-certificates:/harbor_cust_cert:ro
    depends_on: [log, redis]
    networks: [harbor]

  proxy:
    image: goharbor/nginx-photon:v2.15.2
    container_name: ${HARBOR_PROXY_CONTAINER:-nginx}
    restart: always
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    volumes:
      - ${HARBOR_CONFIG_DIR:-../work/common/config}/nginx:/etc/nginx:ro
      - ${HARBOR_CONFIG_DIR:-../work/common/config}/shared/trust-certificates:/harbor_cust_cert:ro
    ports:
      - ${HARBOR_PUBLISH_HOST:-127.0.0.1}:${HARBOR_HTTP_PORT:-8080}:8080
    depends_on: [registry, core, portal, log]
    networks: [harbor]

networks:
  harbor:
    name: ${HARBOR_NETWORK:-harbor}
    driver: bridge
