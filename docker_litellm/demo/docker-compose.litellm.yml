# Keep the project, explicit container names, and external network names in the same instance namespace.
# This follows the repository PROFILE_ENV convention and allows multiple local LiteLLM stacks to coexist.
name: ${PROFILE_ENV:-litellm-baseline}-svc-litellm


networks:
  net-litellm:
    name: ${PROFILE_ENV:-litellm-baseline}-svc-net-litellm

secrets:
  litellm_master_key:
    environment: LITELLM_MASTER_KEY
  postgres_password:
    environment: POSTGRES_PASSWORD
  redis_password:
    environment: REDIS_PASSWORD


x-litellm-common: &litellm-common
  image: ${LITELLM_IMAGE:?set LITELLM_IMAGE to the locally built quay.io/labnow/litellm image}
  pull_policy: always
  restart: "no"
  environment:
    TZ: ${TZ:-Asia/Hong_Kong}
    LITELLM_MASTER_KEY_FILE: /run/secrets/litellm_master_key
    POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    POSTGRES_HOST: db-postgres-litellm
    POSTGRES_PORT: "5432"
    POSTGRES_DB: ${POSTGRES_DB:-litellm}
    POSTGRES_USER: ${POSTGRES_USER:?set in .env}
    REDIS_HOST: db-redis-litellm
    REDIS_PORT: "6379"
    REDIS_PASSWORD_FILE: /run/secrets/redis_password
    REDIS_CIRCUIT_BREAKER_RECOVERY_TIMEOUT: ${REDIS_CIRCUIT_BREAKER_RECOVERY_TIMEOUT:-5}
    STORE_PROMPTS_IN_SPEND_LOGS: "false"
    STORE_MODEL_IN_DB: "True"
    LITELLM_LOG: ${LITELLM_LOG:-INFO}
  volumes:
    - ./config.yaml:/opt/litellm/config.yaml:ro
    - ./config.migrate.yaml:/opt/litellm/config.migrate.yaml:ro
    - ../work/start-litellm.sh:/opt/utils/start-litellm.sh:ro
    - ../work/run-migration-locked.py:/opt/utils/run-migration-locked.py:ro
  secrets:
    - litellm_master_key
    - postgres_password
    - redis_password
  depends_on:
    db-postgres-litellm:
      condition: service_healthy
    db-redis-litellm:
      condition: service_healthy
  networks: ["net-litellm"]
  healthcheck:
    test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/readiness', timeout=3)\""]
    interval: 10s
    timeout: 5s
    retries: 18
    start_period: 30s

services:
  # Run LiteLLM's own migration-only mode explicitly before proxy replicas.
  # Replicas intentionally do not depend on this profile service: the deploy
  # workflow calls scripts/run-migration.sh after postgres/redis are healthy.
  # Prisma's migration table makes repeated one-shot jobs idempotent.
  litellm-migrate:
    <<: *litellm-common
    container_name: ${LITELLM_MIGRATE_CONTAINER_NAME:-${PROFILE_ENV:-litellm-baseline}-svc-litellm-migrate}
    profiles: ["migrate"]
    command: ["/opt/utils/start-litellm.sh", "python3", "/opt/utils/run-migration-locked.py", "--config", "config.migrate.yaml", "--skip_server_startup", "--enforce_prisma_migration_check"]
    healthcheck:
      disable: true
    depends_on:
      db-postgres-litellm:
        condition: service_healthy
      db-redis-litellm:
        condition: service_healthy

  db-postgres-litellm:
    image: quay.io/labnow/postgres-18
    pull_policy: always
    restart: "no"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-litellm}
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      # sudo chown 999:999 /data/storage/database/postgres-18 && sudo chmod 700 /data/storage/database/postgres-18
      - /data/storage/database/postgres-18:/var/lib/postgresql:rw
      - ./sql:/docker-entrypoint-initdb.d:rw
    # su postgres && psql -d ${POSTGRES_DB:-litellm} -U postgres
    networks: ["net-litellm"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d ${POSTGRES_DB:-litellm}"]
      interval: 5s
      timeout: 5s
      retries: 20

  db-redis-litellm:
    image: quay.io/labnow/valkey:9
    pull_policy: always
    restart: "no"
    secrets:
      - redis_password
    tmpfs:
      - /run/redis:mode=0700
    command:
      - /bin/sh
      - -ec
      - >-
        umask 077;
        { printf 'appendonly yes\nrequirepass '; cat /run/secrets/redis_password; printf '\n'; } > /run/redis/redis.conf;
        exec redis-server /run/redis/redis.conf
    volumes:
      # sudo chown 999:999 /data/storage/database/valkey && sudo chmod 700 /data/storage/database/valkey
      - /data/storage/database/valkey:/data:rw
    networks: ["net-litellm"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_password)\" redis-cli --no-auth-warning ping | grep -qx PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  litellm-1:
    <<: *litellm-common
    container_name: ${LITELLM_1_CONTAINER_NAME:-${PROFILE_ENV:-litellm-baseline}-svc-litellm-1}
    profiles: ["single", "ha"]
    ports:
      - "${LITELLM_PUBLISH_HOST:-127.0.0.1}:${LITELLM_1_PORT:-4000}:4000"

  litellm-2:
    <<: *litellm-common
    container_name: ${LITELLM_2_CONTAINER_NAME:-${PROFILE_ENV:-litellm-baseline}-svc-litellm-2}
    profiles: ["ha"]
    ports:
      - "${LITELLM_PUBLISH_HOST:-127.0.0.1}:${LITELLM_2_PORT:-4001}:4000"
