# Runtime configuration. Secrets only come from environment variables.
# The management API persists users, credentials, model records and virtual keys
# in PostgreSQL. Redis is the shared cache/co-ordination backend for replicas.

model_list: []

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  # Keep per-replica virtual-key authorization state short-lived so a revoked
  # key is revalidated through the shared cache within the 30 s smoke SLO.
  user_api_key_cache_ttl: 1
  # Preserve request metadata needed for metering, but do not configure prompt
  # or completion-content logging in this local baseline.
  disable_spend_logs: false
  # Bootstrap phase (LITELLM_DISABLE_PRISMA_SCHEMA_UPDATE=false) applies Prisma
  # migrations under an advisory lock; proxy phase locks it back to true so that
  # replica processes never modify the schema independently.
  disable_prisma_schema_update: os.environ/LITELLM_DISABLE_PRISMA_SCHEMA_UPDATE

litellm_settings:
  # LiteLLM 1.97.0 reads this from litellm_settings and redacts request and
  # response content before standard/spend logging. Metering fields remain.
  turn_off_message_logging: true
  cache: true
  # Make virtual-key authorization cache state visible to every LiteLLM
  # replica. Without this, each replica keeps an isolated in-memory key cache.
  enable_redis_auth_cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    password: os.environ/REDIS_PASSWORD
