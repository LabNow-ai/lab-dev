name: p6-runtime

# One isolated P6 run. Product images are fixed in p6-inputs.json and validated
# before this file is used. Secret values are only read from run-scoped 0400/
# 0600 files; this file and the retained rendering contain no credential.
services:
  litellm-postgres:
    image: ${P6_POSTGRES_IMAGE:?fixed PostgreSQL image required}
    pull_policy: never
    container_name: ${P6_LITELLM_POSTGRES_CONTAINER:?run-scoped container required}
    restart: "no"
    environment:
      POSTGRES_DB: p6_litellm
      POSTGRES_USER: p6_litellm
      POSTGRES_PASSWORD_FILE: /run/secrets/litellm_postgres_password
    secrets: [litellm_postgres_password]
    volumes:
      - litellm_postgres_data:/var/lib/postgresql/data
    networks: [p6-runtime]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U p6_litellm -d p6_litellm"]
      interval: 3s
      timeout: 3s
      retries: 30

  litellm-redis:
    image: ${P6_REDIS_IMAGE:?fixed Redis image required}
    pull_policy: never
    restart: "no"
    secrets: [litellm_redis_password]
    tmpfs:
      - /run/p6:mode=0700
    command:
      - /bin/sh
      - -ec
      - >-
        umask 077;
        { printf 'appendonly yes\nrequirepass '; cat /run/secrets/litellm_redis_password; printf '\n'; } > /run/p6/redis.conf;
        exec redis-server /run/p6/redis.conf
    volumes:
      - litellm_redis_data:/data
    networks: [p6-runtime]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$(cat /run/secrets/litellm_redis_password) redis-cli --no-auth-warning ping | grep -qx PONG"]
      interval: 3s
      timeout: 3s
      retries: 30

  litellm-migrate:
    image: ${P6_LITELLM_IMAGE:?fixed LiteLLM image required}
    pull_policy: never
    restart: "no"
    env_file: ${P6_LITELLM_ENV_FILE:?restricted LiteLLM env required}
    command: ["python3", "/opt/utils/run-migration-locked.py", "--config", "config.migrate.yaml", "--skip_server_startup", "--enforce_prisma_migration_check"]
    secrets: [litellm_redis_password]
    volumes:
      - ${P6_LITELLM_CONFIG:?fixed LiteLLM config required}:/opt/litellm/config.yaml:ro
      - ${P6_LITELLM_MIGRATE_CONFIG:?fixed LiteLLM migration config required}:/opt/litellm/config.migrate.yaml:ro
      - ${P6_LITELLM_START_SCRIPT:?fixed LiteLLM start script required}:/opt/utils/start-litellm.sh:ro
      - ${P6_LITELLM_MIGRATION_SCRIPT:?fixed LiteLLM migration script required}:/opt/utils/run-migration-locked.py:ro
    depends_on:
      litellm-postgres: {condition: service_healthy}
      litellm-redis: {condition: service_healthy}
    networks: [p6-runtime]

  litellm:
    image: ${P6_LITELLM_IMAGE:?fixed LiteLLM image required}
    pull_policy: never
    container_name: ${P6_LITELLM_CONTAINER:?run-scoped container required}
    restart: "no"
    env_file: ${P6_LITELLM_ENV_FILE:?restricted LiteLLM env required}
    command: ["start-litellm.sh"]
    secrets: [litellm_redis_password]
    volumes:
      - ${P6_LITELLM_CONFIG:?fixed LiteLLM config required}:/opt/litellm/config.yaml:ro
      - ${P6_LITELLM_MIGRATE_CONFIG:?fixed LiteLLM migration config required}:/opt/litellm/config.migrate.yaml:ro
      - ${P6_LITELLM_START_SCRIPT:?fixed LiteLLM start script required}:/opt/utils/start-litellm.sh:ro
      - ${P6_LITELLM_MIGRATION_SCRIPT:?fixed LiteLLM migration script required}:/opt/utils/run-migration-locked.py:ro
    depends_on:
      litellm-migrate: {condition: service_completed_successfully}
    networks: [p6-runtime]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/readiness', timeout=3)\""]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 20s

  litellm-gateway:
    image: ${P6_NGINX_IMAGE:?fixed nginx image required}
    pull_policy: never
    restart: "no"
    ports:
      - "127.0.0.1::4443"
    volumes:
      - ${P6_NGINX_CONFIG:?run-scoped nginx config required}:/etc/nginx/nginx.conf:ro
      - ${P6_CA_CERT:?run-scoped certificate required}:/run/p6/p6-ca.pem:ro
      - ${P6_CA_KEY:?run-scoped private key required}:/run/p6/p6-ca.key:ro
    depends_on:
      litellm: {condition: service_healthy}
    networks: [p6-runtime]
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://127.0.0.1:4443/health/readiness >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 30

  shell-postgres:
    image: ${P6_POSTGRES_IMAGE:?fixed PostgreSQL image required}
    pull_policy: never
    container_name: ${P6_SHELL_POSTGRES_CONTAINER:?run-scoped container required}
    restart: "no"
    environment:
      POSTGRES_DB: p6_shell
      POSTGRES_USER: p6_shell
      POSTGRES_PASSWORD_FILE: /run/secrets/shell_postgres_password
    secrets: [shell_postgres_password]
    volumes:
      - shell_postgres_data:/var/lib/postgresql/data
    networks: [p6-runtime]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U p6_shell -d p6_shell"]
      interval: 3s
      timeout: 3s
      retries: 30

  shell-migrate:
    image: ${P6_POSTGRES_IMAGE:?fixed PostgreSQL image required}
    pull_policy: never
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        export PGPASSWORD="$$(cat /run/secrets/shell_postgres_password)";
        exec psql -v ON_ERROR_STOP=1 -h shell-postgres -U p6_shell -d p6_shell -f /run/p6/001_initial.sql
    secrets: [shell_postgres_password]
    volumes:
      - ${P6_SHELL_MIGRATION:?fixed Shell migration required}:/run/p6/001_initial.sql:ro
    depends_on:
      shell-postgres: {condition: service_healthy}
    networks: [p6-runtime]

  user-center:
    image: ${P6_LAUNCHER_IMAGE:?fixed Launcher image required}
    pull_policy: never
    restart: "no"
    entrypoint: ["python", "/run/p6/p6-user-center.py"]
    environment:
      P6_OWNER_A: ${P6_OWNER_A:?owner A required}
      P6_OWNER_B: ${P6_OWNER_B:?owner B required}
    volumes:
      - ${P6_USER_CENTER_SCRIPT:?fixed fixture script required}:/run/p6/p6-user-center.py:ro
    networks: [p6-runtime]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)\""]
      interval: 3s
      timeout: 3s
      retries: 20

  launcher:
    image: ${P6_LAUNCHER_IMAGE:?fixed Launcher image required}
    pull_policy: never
    container_name: ${P6_LAUNCHER_CONTAINER:?run-scoped container required}
    restart: "no"
    env_file: ${P6_LAUNCHER_ENV_FILE:?restricted Launcher env required}
    ports:
      - "127.0.0.1::8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - ${P6_WORKSPACE_ROOT:?isolated Workspace root required}:${P6_WORKSPACE_ROOT}:rw
      - ${P6_LAUNCHER_DATA_DIR:?isolated Launcher state required}:/opt/jupyterhub/data:rw
      - ${P6_LAUNCHER_APP_CONF:?run-scoped app config required}:/opt/jupyterhub/resource/config/app.conf:ro
      - ${P6_MODEL_ACCESS_CONFIG:?restricted model access config required}:/run/p6/model-access.json:ro
      - ${P6_CA_CERT:?run-scoped CA required}:${P6_CA_CERT}:ro
    depends_on:
      shell: {condition: service_healthy}
    networks:
      p6-runtime:
        aliases: [launcher]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/studio/hub/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 20s

  shell:
    image: ${P6_SHELL_IMAGE:?fixed Shell image required}
    pull_policy: never
    container_name: ${P6_SHELL_CONTAINER:?run-scoped container required}
    restart: "no"
    env_file: ${P6_SHELL_ENV_FILE:?restricted Shell env required}
    ports:
      - "127.0.0.1::3002"
    depends_on:
      shell-migrate: {condition: service_completed_successfully}
      user-center: {condition: service_healthy}
      litellm-gateway: {condition: service_healthy}
    networks: [p6-runtime]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3002/console/api/model-access/connections').then(r=>process.exit(r.status===401?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 20s

secrets:
  litellm_postgres_password:
    file: ${P6_LITELLM_POSTGRES_PASSWORD_FILE:?restricted LiteLLM PostgreSQL password required}
  litellm_redis_password:
    file: ${P6_REDIS_PASSWORD_FILE:?restricted Redis password required}
  shell_postgres_password:
    file: ${P6_SHELL_POSTGRES_PASSWORD_FILE:?restricted Shell PostgreSQL password required}

volumes:
  litellm_postgres_data:
  litellm_redis_data:
  shell_postgres_data:

networks:
  p6-runtime:
    name: ${P6_RUNTIME_NETWORK:?isolated network required}
