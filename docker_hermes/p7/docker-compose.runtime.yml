name: p7-hermes

# P7's Hermes component boundary. The full product topology remains owned by
# the checked-in P7 runner, which starts the live Launcher-managed workspace;
# this file deliberately has no fallback image, credential value, or floating
# tag. RuntimeSecretFile is mounted by the Launcher, never injected here as an
# environment value.
services:
  hermes:
    image: ${P7_HERMES_IMAGE:?fixed P7 Hermes image required}
    pull_policy: never
    platform: linux/amd64
    environment:
      HERMES_HOME: /root/.hermes
      HERMES_DASHBOARD: "true"
      HERMES_DASHBOARD_HOST: 127.0.0.1
      HERMES_DASHBOARD_PORT: "9119"
      HERMES_DASHBOARD_USE_TRUSTED_PROXY_AUTH: "true"
    volumes:
      - type: bind
        source: ${P7_HERMES_STATE_DIR:?run-scoped Hermes state required}
        target: /root/.hermes
    healthcheck:
      test: ["CMD", "/usr/local/bin/start-hermes.sh", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 20s
    networks: [p7-runtime]

networks:
  p7-runtime:
    name: ${P7_RUNTIME_NETWORK:?run-scoped network required}
